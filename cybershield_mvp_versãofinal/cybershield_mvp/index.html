<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberShield | Aprenda a se Proteger no Mundo Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar hidden" id="topbar">
      <div class="brand-mini">
        <span class="shield-icon"><img class="topbar-icon" src="assets/icons/cybershield.svg" alt="" aria-hidden="true"></span>
        <span>CyberShield</span>
      </div>
      <div class="agent-hud">
        <span id="hudLevel">Nível 1</span>
        <div class="xp-bar">
          <div id="hudXpBar"></div>
        </div>
        <span id="hudXp">0 XP</span>
      </div>
    </header>

    <main id="app"></main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
